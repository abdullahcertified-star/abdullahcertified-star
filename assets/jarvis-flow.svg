<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12" />
      <stop offset="50%" stop-color="#0B101D" />
      <stop offset="100%" stop-color="#05080F" />
    </linearGradient>

    <!-- Node Glow Gradients -->
    <linearGradient id="cyanNode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1E38" />
      <stop offset="100%" stop-color="#081426" />
    </linearGradient>

    <linearGradient id="purpleNode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B1238" />
      <stop offset="100%" stop-color="#0D091F" />
    </linearGradient>

    <linearGradient id="greenNode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A241B" />
      <stop offset="100%" stop-color="#05140E" />
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#00E5FF" />
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#A855F7" />
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#00FF9D" />
    </marker>

    <!-- Particle Glow Filter -->
    <filter id="glowParticle" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="flowGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#38BDF8" fill-opacity="0.1" />
    </pattern>
  </defs>

  <style>
    @keyframes flowDash {
      to { stroke-dashoffset: -32; }
    }
    @keyframes pulseNode {
      0%, 100% { filter: drop-shadow(0 0 2px rgba(0, 229, 255, 0.4)); }
      50% { filter: drop-shadow(0 0 8px rgba(0, 229, 255, 0.8)); }
    }
    @keyframes pulseSuccess {
      0%, 100% { filter: drop-shadow(0 0 2px rgba(0, 255, 157, 0.4)); }
      50% { filter: drop-shadow(0 0 8px rgba(0, 255, 157, 0.8)); }
    }

    .flow-line {
      stroke-dasharray: 6 6;
      animation: flowDash 1.6s linear infinite;
    }
    .flow-line-reverse {
      stroke-dasharray: 6 6;
      animation: flowDash 1.6s linear infinite reverse;
    }
    .pulse-box { animation: pulseNode 3s infinite ease-in-out; }
    .pulse-success { animation: pulseSuccess 2.5s infinite ease-in-out; }

    .arch-font {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', Consolas, monospace;
    }
  </style>

  <!-- Container Base -->
  <rect x="8" y="8" width="864" height="414" rx="10" fill="url(#flowBg)" stroke="#1F293D" stroke-width="1.5" />
  <rect x="8" y="8" width="864" height="414" fill="url(#flowGrid)" pointer-events="none" />

  <!-- Top Title Bar -->
  <g class="arch-font">
    <rect x="24" y="20" width="832" height="34" rx="4" fill="#0C1424" stroke="#1E2E48" stroke-width="1" />
    <circle cx="40" cy="37" r="4" fill="#00E5FF" />
    <text x="54" y="42" fill="#F1F5F9" font-size="13" font-weight="bold" letter-spacing="1">
      AGENTIC AI ARCHITECTURE // AUTONOMOUS REASONING &amp; TOOL EXECUTION LOOP
    </text>
    <rect x="710" y="25" width="134" height="24" rx="3" fill="#081A2E" stroke="#00E5FF" stroke-width="0.8" />
    <text x="777" y="41" fill="#00E5FF" font-size="10" font-weight="bold" text-anchor="middle" letter-spacing="0.5">
      LANGGRAPH STATE
    </text>
  </g>

  <!-- Connection Paths & Flow Lines -->
  <!-- 1 -> 2: USER to AI AGENT -->
  <path id="pathUserToAgent" d="M 160 105 L 228 105" fill="none" stroke="#00E5FF" stroke-width="2" class="flow-line" marker-end="url(#arrowCyan)" />
  
  <!-- 2 -> 3: AI AGENT to REASON -->
  <path id="pathAgentToReason" d="M 370 105 L 438 105" fill="none" stroke="#00E5FF" stroke-width="2" class="flow-line" marker-end="url(#arrowCyan)" />

  <!-- 3 -> 4: REASON to SELECT TOOL -->
  <path id="pathReasonToTool" d="M 580 105 L 648 105" fill="none" stroke="#00E5FF" stroke-width="2" class="flow-line" marker-end="url(#arrowCyan)" />

  <!-- 4 -> 5: SELECT TOOL down to EXECUTE -->
  <path id="pathToolToExec" d="M 720 140 L 720 200" fill="none" stroke="#A855F7" stroke-width="2" class="flow-line" marker-end="url(#arrowPurple)" />

  <!-- 5 -> 6: EXECUTE left to OBSERVE RESULT -->
  <path id="pathExecToObserve" d="M 650 235 L 590 235" fill="none" stroke="#A855F7" stroke-width="2" class="flow-line-reverse" marker-end="url(#arrowPurple)" />

  <!-- 6 -> 7: OBSERVE RESULT left to REASON AGAIN -->
  <path id="pathObserveToReason2" d="M 440 235 L 380 235" fill="none" stroke="#A855F7" stroke-width="2" class="flow-line-reverse" marker-end="url(#arrowPurple)" />

  <!-- 7 -> Branch A: Feedback loop back up to REASON (Iterate) -->
  <path id="pathLoopBack" d="M 230 235 C 190 235, 190 105, 230 105" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-dasharray="4 4" class="flow-line-reverse" />
  
  <!-- 7 -> Branch B: Down to FINAL RESPONSE -->
  <path id="pathReasonToResponse" d="M 305 270 L 305 328" fill="none" stroke="#00FF9D" stroke-width="2" class="flow-line" marker-end="url(#arrowGreen)" />

  <!-- Animated Moving Particle Orbs -->
  <!-- Orb 1: Forward -->
  <circle r="3.5" fill="#FFFFFF" filter="url(#glowParticle)">
    <animateMotion path="M 160 105 L 228 105" dur="1.2s" repeatCount="indefinite" />
  </circle>
  <circle r="3.5" fill="#FFFFFF" filter="url(#glowParticle)">
    <animateMotion path="M 370 105 L 438 105" dur="1.2s" repeatCount="indefinite" />
  </circle>
  <circle r="3.5" fill="#FFFFFF" filter="url(#glowParticle)">
    <animateMotion path="M 580 105 L 648 105" dur="1.2s" repeatCount="indefinite" />
  </circle>
  <circle r="3.5" fill="#A855F7" filter="url(#glowParticle)">
    <animateMotion path="M 720 140 L 720 200" dur="1.2s" repeatCount="indefinite" />
  </circle>
  <circle r="3.5" fill="#A855F7" filter="url(#glowParticle)">
    <animateMotion path="M 650 235 L 590 235" dur="1.2s" repeatCount="indefinite" />
  </circle>
  <circle r="3.5" fill="#A855F7" filter="url(#glowParticle)">
    <animateMotion path="M 440 235 L 380 235" dur="1.2s" repeatCount="indefinite" />
  </circle>
  <circle r="3" fill="#38BDF8" filter="url(#glowParticle)">
    <animateMotion path="M 230 235 C 190 235, 190 105, 230 105" dur="2.4s" repeatCount="indefinite" />
  </circle>
  <circle r="3.5" fill="#00FF9D" filter="url(#glowParticle)">
    <animateMotion path="M 305 270 L 305 328" dur="1.4s" repeatCount="indefinite" />
  </circle>

  <!-- NODES -->
  <g class="arch-font">
    <!-- Node 1: USER -->
    <g transform="translate(30, 72)">
      <rect x="0" y="0" width="130" height="66" rx="6" fill="url(#cyanNode)" stroke="#00E5FF" stroke-width="1.2" />
      <rect x="10" y="8" width="18" height="18" rx="3" fill="#0B2640" stroke="#00E5FF" stroke-width="0.8" />
      <text x="19" y="21" fill="#00E5FF" font-size="11" text-anchor="middle" font-weight="bold">&gt;_</text>
      <text x="36" y="22" fill="#00E5FF" font-size="12" font-weight="bold" letter-spacing="1">USER</text>
      <text x="12" y="44" fill="#F1F5F9" font-size="11" font-weight="bold">Directive / Prompt</text>
      <text x="12" y="58" fill="#64748B" font-size="9">Input Context</text>
    </g>

    <!-- Node 2: AI AGENT -->
    <g transform="translate(230, 72)">
      <rect x="0" y="0" width="140" height="66" rx="6" fill="url(#cyanNode)" stroke="#00E5FF" stroke-width="1.2" class="pulse-box" />
      <circle cx="20" cy="18" r="5" fill="#00E5FF" />
      <text x="32" y="22" fill="#00E5FF" font-size="12" font-weight="bold" letter-spacing="1">AI AGENT</text>
      <text x="12" y="44" fill="#F1F5F9" font-size="11" font-weight="bold">LangGraph Core</text>
      <text x="12" y="58" fill="#64748B" font-size="9">State Coordinator</text>
    </g>

    <!-- Node 3: REASON -->
    <g transform="translate(440, 72)">
      <rect x="0" y="0" width="140" height="66" rx="6" fill="url(#purpleNode)" stroke="#A855F7" stroke-width="1.2" />
      <polygon points="16,13 22,23 10,23" fill="#A855F7" />
      <text x="28" y="22" fill="#C084FC" font-size="12" font-weight="bold" letter-spacing="1">REASON</text>
      <text x="12" y="44" fill="#F1F5F9" font-size="11" font-weight="bold">Cognitive Plan</text>
      <text x="12" y="58" fill="#64748B" font-size="9">Goal Decomposition</text>
    </g>

    <!-- Node 4: SELECT TOOL -->
    <g transform="translate(650, 72)">
      <rect x="0" y="0" width="140" height="66" rx="6" fill="url(#purpleNode)" stroke="#A855F7" stroke-width="1.2" />
      <rect x="12" y="12" width="10" height="10" rx="2" fill="#A855F7" />
      <text x="28" y="22" fill="#C084FC" font-size="11" font-weight="bold" letter-spacing="0.5">SELECT TOOL</text>
      <text x="12" y="44" fill="#F1F5F9" font-size="11" font-weight="bold">API / Script / CLI</text>
      <text x="12" y="58" fill="#64748B" font-size="9">Parameter Synthesis</text>
    </g>

    <!-- Node 5: EXECUTE -->
    <g transform="translate(650, 202)">
      <rect x="0" y="0" width="140" height="66" rx="6" fill="url(#purpleNode)" stroke="#A855F7" stroke-width="1.2" />
      <polygon points="14,13 24,18 14,23" fill="#A855F7" />
      <text x="30" y="22" fill="#C084FC" font-size="12" font-weight="bold" letter-spacing="1">EXECUTE</text>
      <text x="12" y="44" fill="#F1F5F9" font-size="11" font-weight="bold">Sandboxed Run</text>
      <text x="12" y="58" fill="#64748B" font-size="9">OS / n8n / Network</text>
    </g>

    <!-- Node 6: OBSERVE RESULT -->
    <g transform="translate(440, 202)">
      <rect x="0" y="0" width="150" height="66" rx="6" fill="url(#purpleNode)" stroke="#A855F7" stroke-width="1.2" />
      <circle cx="18" cy="18" r="4" fill="#C084FC" />
      <text x="28" y="22" fill="#C084FC" font-size="11" font-weight="bold" letter-spacing="0.5">OBSERVE RESULT</text>
      <text x="12" y="44" fill="#F1F5F9" font-size="11" font-weight="bold">Telemetry Parsing</text>
      <text x="12" y="58" fill="#64748B" font-size="9">Return Codes &amp; Data</text>
    </g>

    <!-- Node 7: REASON AGAIN -->
    <g transform="translate(230, 202)">
      <rect x="0" y="0" width="150" height="66" rx="6" fill="url(#cyanNode)" stroke="#00E5FF" stroke-width="1.2" class="pulse-box" />
      <circle cx="18" cy="18" r="4" fill="#00E5FF" />
      <text x="28" y="22" fill="#00E5FF" font-size="11" font-weight="bold" letter-spacing="0.5">REASON AGAIN</text>
      <text x="12" y="44" fill="#F1F5F9" font-size="11" font-weight="bold">Evaluate Progress</text>
      <text x="12" y="58" fill="#64748B" font-size="9">Determine Next Step</text>
    </g>

    <!-- Loop Feedback Badge -->
    <g transform="translate(130, 160)">
      <rect x="0" y="0" width="95" height="20" rx="3" fill="#081A2E" stroke="#38BDF8" stroke-width="0.8" />
      <text x="47" y="14" fill="#38BDF8" font-size="9" font-weight="bold" text-anchor="middle">↺ RE-ITERATE</text>
    </g>

    <!-- Node 8: RESPONSE -->
    <g transform="translate(230, 330)">
      <rect x="0" y="0" width="560" height="64" rx="6" fill="url(#greenNode)" stroke="#00FF9D" stroke-width="1.5" class="pulse-success" />
      <circle cx="24" cy="20" r="5" fill="#00FF9D" />
      <text x="36" y="24" fill="#00FF9D" font-size="13" font-weight="bold" letter-spacing="1">RESPONSE // OBJECTIVE SATISFIED</text>
      <text x="16" y="48" fill="#F1F5F9" font-size="11">
        Deterministic output synthesized with guardrails &amp; delivered back to user.
      </text>
      <!-- Clearance Chip -->
      <rect x="445" y="14" width="95" height="20" rx="3" fill="#041F14" stroke="#00FF9D" stroke-width="0.8" />
      <text x="492" y="27" fill="#00FF9D" font-size="9" font-weight="bold" text-anchor="middle">VERIFIED [OK]</text>
    </g>
  </g>
</svg>
