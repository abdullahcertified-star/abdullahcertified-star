<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="cardBgSec" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#08141F" />
      <stop offset="100%" stop-color="#050B12" />
    </linearGradient>

    <linearGradient id="cardBgAI" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#100F26" />
      <stop offset="100%" stop-color="#080814" />
    </linearGradient>

    <linearGradient id="cardBgSys" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#071424" />
      <stop offset="100%" stop-color="#040A14" />
    </linearGradient>

    <!-- Scanline Pattern -->
    <pattern id="arsenalGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#38BDF8" fill-opacity="0.08" />
    </pattern>

    <!-- Glow Filters -->
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseLedGreen {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 5px #00FF9D); }
      50% { opacity: 0.35; filter: drop-shadow(0 0 1px #00FF9D); }
    }
    @keyframes pulseLedPurple {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 5px #A855F7); }
      50% { opacity: 0.35; filter: drop-shadow(0 0 1px #A855F7); }
    }
    @keyframes pulseLedCyan {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 5px #00E5FF); }
      50% { opacity: 0.35; filter: drop-shadow(0 0 1px #00E5FF); }
    }

    @keyframes laserSweep {
      0% { transform: translateY(0); opacity: 0.4; }
      50% { opacity: 0.8; }
      100% { transform: translateY(240px); opacity: 0.2; }
    }

    @keyframes borderGlowPulse {
      0%, 100% { stroke-opacity: 0.6; }
      50% { stroke-opacity: 1; filter: drop-shadow(0 0 4px rgba(0, 229, 255, 0.4)); }
    }

    .pulse-green { animation: pulseLedGreen 2s infinite ease-in-out; }
    .pulse-purple { animation: pulseLedPurple 2.4s infinite ease-in-out; }
    .pulse-cyan { animation: pulseLedCyan 2.8s infinite ease-in-out; }
    .laser-beam { animation: laserSweep 4.5s linear infinite; }
    .border-glow { animation: borderGlowPulse 3s infinite ease-in-out; }

    .arsenal-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace;
    }
  </style>

  <!-- ==================== COLUMN 1: CYBERSECURITY & SOC ==================== -->
  <g transform="translate(15, 15)">
    <!-- Card Container -->
    <rect x="0" y="0" width="300" height="240" rx="8" fill="url(#cardBgSec)" stroke="#16382B" stroke-width="1.2" class="border-glow" />
    <rect x="0" y="0" width="300" height="240" rx="8" fill="url(#arsenalGrid)" pointer-events="none" />

    <!-- Corner HUD Brackets -->
    <path d="M 0 18 L 0 0 L 18 0" fill="none" stroke="#00FF9D" stroke-width="2" />
    <path d="M 300 18 L 300 0 L 282 0" fill="none" stroke="#00FF9D" stroke-width="2" />
    <path d="M 0 222 L 0 240 L 18 240" fill="none" stroke="#00FF9D" stroke-width="2" />
    <path d="M 300 222 L 300 240 L 282 240" fill="none" stroke="#00FF9D" stroke-width="2" />

    <!-- Scanning Laser Line -->
    <g class="laser-beam" pointer-events="none">
      <line x1="2" y1="0" x2="298" y2="0" stroke="#00FF9D" stroke-width="1" stroke-opacity="0.35" />
    </g>

    <!-- Header Bar -->
    <rect x="12" y="12" width="276" height="34" rx="4" fill="#062016" stroke="#0D442E" stroke-width="1" />
    <circle cx="28" cy="29" r="4.5" fill="#00FF9D" class="pulse-green" />
    <text x="42" y="33" fill="#F1F5F9" font-size="12" font-weight="bold" letter-spacing="0.5" class="arsenal-text">
      🛡️ CYBERSECURITY &amp; SOC
    </text>
    <rect x="230" y="21" width="48" height="16" rx="3" fill="#02140D" stroke="#00FF9D" stroke-width="0.7" />
    <text x="254" y="32" fill="#00FF9D" font-size="8.5" font-weight="bold" text-anchor="middle" class="arsenal-text">LIVE</text>

    <!-- Bullet Items -->
    <g class="arsenal-text" font-size="11">
      <!-- Item 1 -->
      <g transform="translate(16, 70)">
        <text x="0" y="0" fill="#00FF9D" font-weight="bold">›</text>
        <text x="14" y="0" fill="#F1F5F9" font-weight="bold">SOC &amp; SIEM:</text>
        <text x="96" y="0" fill="#94A3B8">Telemetry &amp; Logs</text>
      </g>
      <!-- Item 2 -->
      <g transform="translate(16, 102)">
        <text x="0" y="0" fill="#00FF9D" font-weight="bold">›</text>
        <text x="14" y="0" fill="#F1F5F9" font-weight="bold">Intrusion Detect:</text>
        <text x="120" y="0" fill="#94A3B8">Scapy Sniffing</text>
      </g>
      <!-- Item 3 -->
      <g transform="translate(16, 134)">
        <text x="0" y="0" fill="#00FF9D" font-weight="bold">›</text>
        <text x="14" y="0" fill="#F1F5F9" font-weight="bold">Threat Mapping:</text>
        <text x="116" y="0" fill="#94A3B8">MITRE ATT&amp;CK</text>
      </g>
      <!-- Item 4 -->
      <g transform="translate(16, 166)">
        <text x="0" y="0" fill="#00FF9D" font-weight="bold">›</text>
        <text x="14" y="0" fill="#F1F5F9" font-weight="bold">Network Defense:</text>
        <text x="124" y="0" fill="#94A3B8">Wireshark / Wire</text>
      </g>
      <!-- Item 5 -->
      <g transform="translate(16, 198)">
        <text x="0" y="0" fill="#00FF9D" font-weight="bold">›</text>
        <text x="14" y="0" fill="#F1F5F9" font-weight="bold">Auth Security:</text>
        <text x="104" y="0" fill="#94A3B8">JWT Tokens &amp; bcrypt</text>
      </g>
    </g>

    <!-- Bottom Status Line -->
    <line x1="16" y1="218" x2="284" y2="218" stroke="#122A20" stroke-width="1" />
    <text x="16" y="231" fill="#00FF9D" font-size="9" font-weight="bold" class="arsenal-text">MODULE STATUS: SECURED</text>
    <text x="284" y="231" fill="#64748B" font-size="9" text-anchor="end" class="arsenal-text">256-BIT</text>
  </g>

  <!-- ==================== COLUMN 2: AGENTIC AI & LLMS ==================== -->
  <g transform="translate(330, 15)">
    <!-- Card Container -->
    <rect x="0" y="0" width="300" height="240" rx="8" fill="url(#cardBgAI)" stroke="#2D1C52" stroke-width="1.2" class="border-glow" />
    <rect x="0" y="0" width="300" height="240" rx="8" fill="url(#arsenalGrid)" pointer-events="none" />

    <!-- Corner HUD Brackets -->
    <path d="M 0 18 L 0 0 L 18 0" fill="none" stroke="#A855F7" stroke-width="2" />
    <path d="M 300 18 L 300 0 L 282 0" fill="none" stroke="#A855F7" stroke-width="2" />
    <path d="M 0 222 L 0 240 L 18 240" fill="none" stroke="#A855F7" stroke-width="2" />
    <path d="M 300 222 L 300 240 L 282 240" fill="none" stroke="#A855F7" stroke-width="2" />

    <!-- Scanning Laser Line -->
    <g class="laser-beam" pointer-events="none">
      <line x1="2" y1="0" x2="298" y2="0" stroke="#A855F7" stroke-width="1" stroke-opacity="0.35" />
    </g>

    <!-- Header Bar -->
    <rect x="12" y="12" width="276" height="34" rx="4" fill="#180C34" stroke="#371B70" stroke-width="1" />
    <circle cx="28" cy="29" r="4.5" fill="#A855F7" class="pulse-purple" />
    <text x="42" y="33" fill="#F1F5F9" font-size="12" font-weight="bold" letter-spacing="0.5" class="arsenal-text">
      🤖 AGENTIC AI &amp; LLMS
    </text>
    <rect x="230" y="21" width="48" height="16" rx="3" fill="#0F0624" stroke="#A855F7" stroke-width="0.7" />
    <text x="254" y="32" fill="#C084FC" font-size="8.5" font-weight="bold" text-anchor="middle" class="arsenal-text">ACTIVE</text>

    <!-- Bullet Items -->
    <g class="arsenal-text" font-size="11">
      <!-- Item 1 -->
      <g transform="translate(16, 70)">
        <text x="0" y="0" fill="#C084FC" font-weight="bold">›</text>
        <text x="14" y="0" fill="#F1F5F9" font-weight="bold">State Graphs:</text>
        <text x="100" y="0" fill="#94A3B8">LangGraph Loops</text>
      </g>
      <!-- Item 2 -->
      <g transform="translate(16, 102)">
        <text x="0" y="0" fill="#C084FC" font-weight="bold">›</text>
        <text x="14" y="0" fill="#F1F5F9" font-weight="bold">Frameworks:</text>
        <text x="96" y="0" fill="#94A3B8">LangChain &amp; Agents</text>
      </g>
      <!-- Item 3 -->
      <g transform="translate(16, 134)">
        <text x="0" y="0" fill="#C084FC" font-weight="bold">›</text>
        <text x="14" y="0" fill="#F1F5F9" font-weight="bold">RAG Architecture:</text>
        <text x="128" y="0" fill="#94A3B8">Vector Retrieval</text>
      </g>
      <!-- Item 4 -->
      <g transform="translate(16, 166)">
        <text x="0" y="0" fill="#C084FC" font-weight="bold">›</text>
        <text x="14" y="0" fill="#F1F5F9" font-weight="bold">Tool Calling:</text>
        <text x="98" y="0" fill="#94A3B8">Autonomous Dispatch</text>
      </g>
      <!-- Item 5 -->
      <g transform="translate(16, 198)">
        <text x="0" y="0" fill="#C084FC" font-weight="bold">›</text>
        <text x="14" y="0" fill="#F1F5F9" font-weight="bold">Workflow Engine:</text>
        <text x="126" y="0" fill="#94A3B8">n8n Automation</text>
      </g>
    </g>

    <!-- Bottom Status Line -->
    <line x1="16" y1="218" x2="284" y2="218" stroke="#221244" stroke-width="1" />
    <text x="16" y="231" fill="#C084FC" font-size="9" font-weight="bold" class="arsenal-text">COGNITIVE ENGINE: READY</text>
    <text x="284" y="231" fill="#64748B" font-size="9" text-anchor="end" class="arsenal-text">STATEFUL</text>
  </g>

  <!-- ==================== COLUMN 3: LANGUAGES & SYSTEMS ==================== -->
  <g transform="translate(645, 15)">
    <!-- Card Container -->
    <rect x="0" y="0" width="300" height="240" rx="8" fill="url(#cardBgSys)" stroke="#163454" stroke-width="1.2" class="border-glow" />
    <rect x="0" y="0" width="300" height="240" rx="8" fill="url(#arsenalGrid)" pointer-events="none" />

    <!-- Corner HUD Brackets -->
    <path d="M 0 18 L 0 0 L 18 0" fill="none" stroke="#00E5FF" stroke-width="2" />
    <path d="M 300 18 L 300 0 L 282 0" fill="none" stroke="#00E5FF" stroke-width="2" />
    <path d="M 0 222 L 0 240 L 18 240" fill="none" stroke="#00E5FF" stroke-width="2" />
    <path d="M 300 222 L 300 240 L 282 240" fill="none" stroke="#00E5FF" stroke-width="2" />

    <!-- Scanning Laser Line -->
    <g class="laser-beam" pointer-events="none">
      <line x1="2" y1="0" x2="298" y2="0" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.35" />
    </g>

    <!-- Header Bar -->
    <rect x="12" y="12" width="276" height="34" rx="4" fill="#082038" stroke="#104270" stroke-width="1" />
    <circle cx="28" cy="29" r="4.5" fill="#00E5FF" class="pulse-cyan" />
    <text x="42" y="33" fill="#F1F5F9" font-size="12" font-weight="bold" letter-spacing="0.5" class="arsenal-text">
      ⚙️ LANGUAGES &amp; SYSTEMS
    </text>
    <rect x="230" y="21" width="48" height="16" rx="3" fill="#041224" stroke="#00E5FF" stroke-width="0.7" />
    <text x="254" y="32" fill="#00E5FF" font-size="8.5" font-weight="bold" text-anchor="middle" class="arsenal-text">SYNC</text>

    <!-- Bullet Items -->
    <g class="arsenal-text" font-size="11">
      <!-- Item 1 -->
      <g transform="translate(16, 70)">
        <text x="0" y="0" fill="#38BDF8" font-weight="bold">›</text>
        <text x="14" y="0" fill="#F1F5F9" font-weight="bold">Languages:</text>
        <text x="88" y="0" fill="#94A3B8">Python • C • C++ • SQL</text>
      </g>
      <!-- Item 2 -->
      <g transform="translate(16, 102)">
        <text x="0" y="0" fill="#38BDF8" font-weight="bold">›</text>
        <text x="14" y="0" fill="#F1F5F9" font-weight="bold">Backend APIs:</text>
        <text x="104" y="0" fill="#94A3B8">FastAPI • Flask • REST</text>
      </g>
      <!-- Item 3 -->
      <g transform="translate(16, 134)">
        <text x="0" y="0" fill="#38BDF8" font-weight="bold">›</text>
        <text x="14" y="0" fill="#F1F5F9" font-weight="bold">Databases:</text>
        <text x="86" y="0" fill="#94A3B8">SQLite • PostgreSQL</text>
      </g>
      <!-- Item 4 -->
      <g transform="translate(16, 166)">
        <text x="0" y="0" fill="#38BDF8" font-weight="bold">›</text>
        <text x="14" y="0" fill="#F1F5F9" font-weight="bold">Operating Sys:</text>
        <text x="110" y="0" fill="#94A3B8">Linux • Windows</text>
      </g>
      <!-- Item 5 -->
      <g transform="translate(16, 198)">
        <text x="0" y="0" fill="#38BDF8" font-weight="bold">›</text>
        <text x="14" y="0" fill="#F1F5F9" font-weight="bold">DevOps &amp; Tools:</text>
        <text x="116" y="0" fill="#94A3B8">Git • Docker • Bash</text>
      </g>
    </g>

    <!-- Bottom Status Line -->
    <line x1="16" y1="218" x2="284" y2="218" stroke="#102740" stroke-width="1" />
    <text x="16" y="231" fill="#38BDF8" font-size="9" font-weight="bold" class="arsenal-text">ENVIRONMENT: HARDENED</text>
    <text x="284" y="231" fill="#64748B" font-size="9" text-anchor="end" class="arsenal-text">CONTAINER</text>
  </g>
</svg>
