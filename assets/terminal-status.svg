<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%">
  <defs>
    <linearGradient id="jarvisBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0C121F" />
      <stop offset="100%" stop-color="#060910" />
    </linearGradient>

    <linearGradient id="hudCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="hudGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF9D" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <pattern id="diagGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#38BDF8" fill-opacity="0.12" />
    </pattern>

    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseGreen {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 4px #00FF9D); }
      50% { opacity: 0.4; filter: drop-shadow(0 0 1px #00FF9D); }
    }
    @keyframes pulseCyan {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 4px #00E5FF); }
      50% { opacity: 0.4; filter: drop-shadow(0 0 1px #00E5FF); }
    }
    @keyframes radarScan {
      0% { transform: translateY(0); opacity: 0.4; }
      50% { opacity: 0.8; }
      100% { transform: translateY(310px); opacity: 0.2; }
    }

    .pulse-g { animation: pulseGreen 2.2s infinite ease-in-out; }
    .pulse-c { animation: pulseCyan 2.6s infinite ease-in-out; }
    .hud-scan { animation: radarScan 5s linear infinite; }

    .hud-mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', Consolas, monospace;
    }
  </style>

  <!-- Background Base -->
  <rect x="10" y="10" width="780" height="330" rx="8" fill="url(#jarvisBg)" stroke="#1E293B" stroke-width="1.5" />
  
  <!-- Subtle Grid -->
  <rect x="10" y="10" width="780" height="330" fill="url(#diagGrid)" pointer-events="none" />

  <!-- Scanning Sweep Beam -->
  <g class="hud-scan" pointer-events="none">
    <line x1="12" y1="12" x2="788" y2="12" stroke="#00E5FF" stroke-width="1.2" stroke-opacity="0.25" />
  </g>

  <!-- High-Tech Corner Brackets -->
  <path d="M 12 34 L 12 12 L 34 12" fill="none" stroke="#00E5FF" stroke-width="2.5" />
  <path d="M 788 34 L 788 12 L 766 12" fill="none" stroke="#00E5FF" stroke-width="2.5" />
  <path d="M 12 316 L 12 338 L 34 338" fill="none" stroke="#00FF9D" stroke-width="2.5" />
  <path d="M 788 316 L 788 338 L 766 338" fill="none" stroke="#00FF9D" stroke-width="2.5" />

  <!-- Header Banner -->
  <g class="hud-mono">
    <rect x="25" y="24" width="750" height="42" rx="4" fill="#0C1424" stroke="#1E2E48" stroke-width="1" />
    
    <!-- Left Logo/Icon Indicator -->
    <polygon points="42,37 49,45 42,53 35,45" fill="#00E5FF" />
    <circle cx="42" cy="45" r="1.5" fill="#FFFFFF" />

    <text x="60" y="44" fill="#F1F5F9" font-size="14" font-weight="bold" letter-spacing="1.5">
      J.A.R.V.I.S // PERSONAL AI DIAGNOSTIC CONSOLE
    </text>
    <text x="60" y="58" fill="#64748B" font-size="10" letter-spacing="0.5">
      COGNITIVE ENGINE &amp; DEFENSE MATRIX TELEMETRY
    </text>

    <!-- Right Header Badges -->
    <rect x="628" y="32" width="135" height="24" rx="4" fill="#081A2E" stroke="#00E5FF" stroke-width="0.8" />
    <text x="695" y="48" fill="#00E5FF" font-size="10" font-weight="bold" text-anchor="middle" letter-spacing="1">
      KERNEL v4.2 // READY
    </text>
  </g>

  <!-- Telemetry Rows -->
  <g class="hud-mono" font-size="12">
    <!-- Row 1: Security Module -->
    <g transform="translate(30, 85)">
      <rect x="0" y="0" width="740" height="38" rx="4" fill="#091120" stroke="#17243B" stroke-width="1" />
      <text x="18" y="24" fill="#F1F5F9" font-weight="bold" letter-spacing="1">SECURITY MODULE</text>
      <line x1="205" y1="19" x2="355" y2="19" stroke="#1E2E48" stroke-width="1" stroke-dasharray="3,3" />
      
      <!-- Status Badge -->
      <g class="pulse-g">
        <circle cx="375" cy="19" r="4.5" fill="#00FF9D" />
      </g>
      <text x="390" y="24" fill="#00FF9D" font-weight="bold" letter-spacing="1">ONLINE</text>
      
      <!-- Sub-label -->
      <text x="500" y="24" fill="#94A3B8" font-size="11">SOC Telemetry • IDS • Auth Guard</text>
      <text x="720" y="24" fill="#38BDF8" font-size="10" text-anchor="end">[0.02ms]</text>
    </g>

    <!-- Row 2: AI Agents -->
    <g transform="translate(30, 130)">
      <rect x="0" y="0" width="740" height="38" rx="4" fill="#091120" stroke="#17243B" stroke-width="1" />
      <text x="18" y="24" fill="#F1F5F9" font-weight="bold" letter-spacing="1">AI AGENTS</text>
      <line x1="205" y1="19" x2="355" y2="19" stroke="#1E2E48" stroke-width="1" stroke-dasharray="3,3" />
      
      <!-- Status Badge -->
      <g class="pulse-c">
        <circle cx="375" cy="19" r="4.5" fill="#00E5FF" />
      </g>
      <text x="390" y="24" fill="#00E5FF" font-weight="bold" letter-spacing="1">ACTIVE</text>
      
      <!-- Sub-label -->
      <text x="500" y="24" fill="#94A3B8" font-size="11">LangGraph • Tool Calling • RAG Loop</text>
      <text x="720" y="24" fill="#38BDF8" font-size="10" text-anchor="end">[STATEFUL]</text>
    </g>

    <!-- Row 3: Automation Engine -->
    <g transform="translate(30, 175)">
      <rect x="0" y="0" width="740" height="38" rx="4" fill="#091120" stroke="#17243B" stroke-width="1" />
      <text x="18" y="24" fill="#F1F5F9" font-weight="bold" letter-spacing="1">AUTOMATION ENGINE</text>
      <line x1="205" y1="19" x2="355" y2="19" stroke="#1E2E48" stroke-width="1" stroke-dasharray="3,3" />
      
      <!-- Status Badge -->
      <g class="pulse-g">
        <circle cx="375" cy="19" r="4.5" fill="#00FF9D" />
      </g>
      <text x="390" y="24" fill="#00FF9D" font-weight="bold" letter-spacing="1">READY</text>
      
      <!-- Sub-label -->
      <text x="500" y="24" fill="#94A3B8" font-size="11">n8n Workflows • Webhooks • System Hooks</text>
      <text x="720" y="24" fill="#38BDF8" font-size="10" text-anchor="end">[STANDBY]</text>
    </g>

    <!-- Row 4: Network Analysis -->
    <g transform="translate(30, 220)">
      <rect x="0" y="0" width="740" height="38" rx="4" fill="#091120" stroke="#17243B" stroke-width="1" />
      <text x="18" y="24" fill="#F1F5F9" font-weight="bold" letter-spacing="1">NETWORK ANALYSIS</text>
      <line x1="205" y1="19" x2="355" y2="19" stroke="#1E2E48" stroke-width="1" stroke-dasharray="3,3" />
      
      <!-- Status Badge -->
      <g class="pulse-g">
        <circle cx="375" cy="19" r="4.5" fill="#00FF9D" />
      </g>
      <text x="390" y="24" fill="#00FF9D" font-weight="bold" letter-spacing="1">READY</text>
      
      <!-- Sub-label -->
      <text x="500" y="24" fill="#94A3B8" font-size="11">Packet Crafting • Scapy Sniffer • Wireshark</text>
      <text x="720" y="24" fill="#38BDF8" font-size="10" text-anchor="end">[PROMISC]</text>
    </g>

    <!-- Row 5: Python Environment -->
    <g transform="translate(30, 265)">
      <rect x="0" y="0" width="740" height="38" rx="4" fill="#091120" stroke="#17243B" stroke-width="1" />
      <text x="18" y="24" fill="#F1F5F9" font-weight="bold" letter-spacing="1">PYTHON ENVIRONMENT</text>
      <line x1="205" y1="19" x2="355" y2="19" stroke="#1E2E48" stroke-width="1" stroke-dasharray="3,3" />
      
      <!-- Status Badge -->
      <g class="pulse-c">
        <circle cx="375" cy="19" r="4.5" fill="#00E5FF" />
      </g>
      <text x="390" y="24" fill="#00E5FF" font-weight="bold" letter-spacing="1">ACTIVE</text>
      
      <!-- Sub-label -->
      <text x="500" y="24" fill="#94A3B8" font-size="11">v3.12 Core • FastAPI • Hardened Runtime</text>
      <text x="720" y="24" fill="#38BDF8" font-size="10" text-anchor="end">[SECURED]</text>
    </g>
  </g>

  <!-- Console Footer Bar -->
  <g class="hud-mono" transform="translate(30, 312)">
    <!-- System Mode Indicator -->
    <rect x="0" y="0" width="220" height="22" rx="3" fill="#061824" stroke="#00FF9D" stroke-width="0.8" />
    <circle cx="12" cy="11" r="3" fill="#00FF9D" class="pulse-g" />
    <text x="24" y="15" fill="#00FF9D" font-size="10" font-weight="bold" letter-spacing="1">
      SYSTEM MODE: DEVELOPMENT
    </text>

    <!-- Center Focus Notice -->
    <text x="440" y="15" fill="#64748B" font-size="10" text-anchor="middle" letter-spacing="0.5">
      // CORE FOCUS MATRIX • APPLIED CYBERSECURITY &amp; AGENTIC SYSTEMS
    </text>

    <!-- Right Latency / Node -->
    <text x="740" y="15" fill="#38BDF8" font-size="10" font-weight="bold" text-anchor="end">
      NODE: MAR-OPS-01
    </text>
  </g>
</svg>
