<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 290" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="flowBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050A14" />
      <stop offset="50%" stop-color="#081426" />
      <stop offset="100%" stop-color="#040810" />
    </linearGradient>

    <!-- Glowing Rail Gradients -->
    <linearGradient id="railCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00FF9D" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="railPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.3" />
    </linearGradient>

    <!-- Node Card Gradients -->
    <linearGradient id="nodeSecGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#09182A" />
      <stop offset="100%" stop-color="#050F1C" />
    </linearGradient>

    <linearGradient id="nodeAiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#140D2E" />
      <stop offset="100%" stop-color="#0A061A" />
    </linearGradient>

    <!-- Dot Grid Pattern -->
    <pattern id="flowGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#38BDF8" fill-opacity="0.1" />
    </pattern>

    <!-- Glow Filters -->
    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="particleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes coreSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes coreSpinReverse {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes pulseCoreGlow {
      0%, 100% { filter: drop-shadow(0 0 6px #00E5FF); }
      50% { filter: drop-shadow(0 0 16px #00FF9D); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -28; }
    }
    @keyframes ledBeacon {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 5px #00FF9D); }
      50% { opacity: 0.35; filter: drop-shadow(0 0 1px #00FF9D); }
    }

    .core-rotor {
      transform-origin: 480px 155px;
      animation: coreSpin 8s linear infinite;
    }
    .core-rotor-rev {
      transform-origin: 480px 155px;
      animation: coreSpinReverse 12s linear infinite;
    }
    .core-glow { animation: pulseCoreGlow 3s infinite ease-in-out; }
    .rail-flow {
      stroke-dasharray: 6 5;
      animation: dashMove 1.4s linear infinite;
    }
    .beacon { animation: ledBeacon 2s infinite ease-in-out; }

    .hud-font {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace;
    }
    .mono-font {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', Consolas, monospace;
    }
  </style>

  <!-- Container Base -->
  <rect x="6" y="6" width="948" height="278" rx="8" fill="url(#flowBgGrad)" stroke="#162D4A" stroke-width="1.4" />
  <rect x="6" y="6" width="948" height="278" rx="8" fill="url(#flowGrid)" pointer-events="none" />

  <!-- Corner Chamfers -->
  <polygon points="6,6 24,6 6,24" fill="#00E5FF" />
  <polygon points="954,6 936,6 954,24" fill="#00FF9D" />
  <polygon points="6,284 24,284 6,266" fill="#00FF9D" />
  <polygon points="954,284 936,284 954,266" fill="#00E5FF" />

  <!-- Header Bar -->
  <g class="mono-font">
    <rect x="18" y="14" width="924" height="32" rx="4" fill="#07182C" stroke="#123258" stroke-width="1" />
    <circle cx="34" cy="30" r="4.5" fill="#00FF9D" class="beacon" />
    <text x="48" y="34" fill="#F1F5F9" font-size="12" font-weight="bold" letter-spacing="1">
      J.A.R.V.I.S // INTEGRATED COGNITIVE &amp; DEFENSE ARCHITECTURE FLOW
    </text>
    <rect x="710" y="19" width="220" height="22" rx="3" fill="#042016" stroke="#00FF9D" stroke-width="0.8" />
    <text x="820" y="33" fill="#00FF9D" font-size="9.5" font-weight="bold" text-anchor="middle" letter-spacing="0.5">
      KERNEL v4.2 // STATEFUL FLOW
    </text>
  </g>

  <!-- ==================== FLOW CONNECTOR RAILS ==================== -->
  <g fill="none">
    <!-- Path 1: Top-Left (SOC) to Core -->
    <path d="M 300 100 Q 390 120 440 155" stroke="#16385C" stroke-width="2.5" />
    <path d="M 300 100 Q 390 120 440 155" stroke="url(#railCyan)" stroke-width="1.8" class="rail-flow" />

    <!-- Path 2: Bottom-Left (Crypto) to Core -->
    <path d="M 300 205 Q 390 185 440 165" stroke="#16385C" stroke-width="2.5" />
    <path d="M 300 205 Q 390 185 440 165" stroke="url(#railCyan)" stroke-width="1.8" class="rail-flow" />

    <!-- Path 3: Top-Right (Agentic AI) to Core -->
    <path d="M 660 100 Q 570 120 520 155" stroke="#2B1A4E" stroke-width="2.5" />
    <path d="M 660 100 Q 570 120 520 155" stroke="url(#railPurple)" stroke-width="1.8" class="rail-flow" />

    <!-- Path 4: Bottom-Right (Automation) to Core -->
    <path d="M 660 205 Q 570 185 520 165" stroke="#2B1A4E" stroke-width="2.5" />
    <path d="M 660 205 Q 570 185 520 165" stroke="url(#railPurple)" stroke-width="1.8" class="rail-flow" />
  </g>

  <!-- Animated Moving Particle Orbs along flow lines -->
  <circle r="4" fill="#00FF9D" filter="url(#particleGlow)">
    <animateMotion path="M 300 100 Q 390 120 440 155" dur="1.8s" repeatCount="indefinite" />
  </circle>
  <circle r="4" fill="#00E5FF" filter="url(#particleGlow)">
    <animateMotion path="M 300 205 Q 390 185 440 165" dur="2.1s" repeatCount="indefinite" />
  </circle>
  <circle r="4" fill="#A855F7" filter="url(#particleGlow)">
    <animateMotion path="M 660 100 Q 570 120 520 155" dur="1.9s" repeatCount="indefinite" />
  </circle>
  <circle r="4" fill="#38BDF8" filter="url(#particleGlow)">
    <animateMotion path="M 660 205 Q 570 185 520 165" dur="2.3s" repeatCount="indefinite" />
  </circle>

  <!-- ==================== CENTRAL QUANTUM AI NUCLEUS / REACTOR ==================== -->
  <g transform="translate(480, 155)">
    <!-- Outer Hologram Ring -->
    <circle cx="0" cy="0" r="50" fill="#061224" stroke="#16385C" stroke-width="1.5" />
    
    <!-- Rotating Dashed Rotor 1 -->
    <g class="core-rotor">
      <circle cx="0" cy="0" r="42" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.8" />
    </g>

    <!-- Rotating Dashed Rotor 2 (Reverse) -->
    <g class="core-rotor-rev">
      <circle cx="0" cy="0" r="34" fill="none" stroke="#A855F7" stroke-width="1.2" stroke-dasharray="12 4" opacity="0.75" />
    </g>

    <!-- Inner Core Bulb -->
    <circle cx="0" cy="0" r="22" fill="#08223C" stroke="#00FF9D" stroke-width="1.8" class="core-glow" />
    <circle cx="0" cy="0" r="10" fill="#00FF9D">
      <animate attributeName="r" values="8;11;8" dur="1.5s" repeatCount="indefinite" />
    </circle>
    
    <!-- Text Badge below reactor -->
    <g class="mono-font">
      <rect x="-42" y="28" width="84" height="17" rx="3" fill="#031422" stroke="#00E5FF" stroke-width="0.8" />
      <text x="0" y="40" fill="#00E5FF" font-size="8.5" font-weight="bold" text-anchor="middle" letter-spacing="1">
        AI-CORE
      </text>
    </g>
  </g>

  <!-- ==================== SATELLITE MODULE 1: SOC & IDS (Top-Left) ==================== -->
  <g transform="translate(24, 60)" class="hud-font">
    <rect x="0" y="0" width="280" height="74" rx="6" fill="url(#nodeSecGrad)" stroke="#16385C" stroke-width="1.2" />
    <circle cx="16" cy="18" r="4" fill="#00FF9D" class="beacon" />
    <text x="28" y="22" fill="#F1F5F9" font-size="12" font-weight="bold">🛡️ SOC &amp; IDS TELEMETRY</text>
    <rect x="204" y="9" width="66" height="16" rx="2" fill="#031F14" stroke="#00FF9D" stroke-width="0.6" />
    <text x="237" y="20" fill="#00FF9D" font-size="8" font-weight="bold" text-anchor="middle" class="mono-font">● ARMED</text>
    <line x1="12" y1="34" x2="268" y2="34" stroke="#122740" stroke-width="1" />
    <text x="12" y="49" fill="#94A3B8" font-size="10">Multi-threaded Scapy sniffer &amp; packet stats</text>
    <text x="12" y="63" fill="#38BDF8" font-size="9.5" class="mono-font">12 Attack Heuristics • MITRE ATT&amp;CK</text>
  </g>

  <!-- ==================== SATELLITE MODULE 2: CRYPTOGRAPHY & AUTH (Bottom-Left) ==================== -->
  <g transform="translate(24, 168)" class="hud-font">
    <rect x="0" y="0" width="280" height="74" rx="6" fill="url(#nodeSecGrad)" stroke="#16385C" stroke-width="1.2" />
    <circle cx="16" cy="18" r="4" fill="#00E5FF" class="beacon" />
    <text x="28" y="22" fill="#F1F5F9" font-size="12" font-weight="bold">🔒 CRYPTO &amp; SECURE AUTH</text>
    <rect x="204" y="9" width="66" height="16" rx="2" fill="#071E36" stroke="#00E5FF" stroke-width="0.6" />
    <text x="237" y="20" fill="#00E5FF" font-size="8" font-weight="bold" text-anchor="middle" class="mono-font">SECURED</text>
    <line x1="12" y1="34" x2="268" y2="34" stroke="#122740" stroke-width="1" />
    <text x="12" y="49" fill="#94A3B8" font-size="10">C++17 algorithmic defense &amp; Levenshtein</text>
    <text x="12" y="63" fill="#00FF9D" font-size="9.5" class="mono-font">Salted OTP RBAC • ISO 27001 ISMS</text>
  </g>

  <!-- ==================== SATELLITE MODULE 3: AGENTIC AI (Top-Right) ==================== -->
  <g transform="translate(656, 60)" class="hud-font">
    <rect x="0" y="0" width="280" height="74" rx="6" fill="url(#nodeAiGrad)" stroke="#2B1A4E" stroke-width="1.2" />
    <circle cx="16" cy="18" r="4" fill="#A855F7" class="beacon" />
    <text x="28" y="22" fill="#F1F5F9" font-size="12" font-weight="bold">🤖 AGENTIC REASONING</text>
    <rect x="204" y="9" width="66" height="16" rx="2" fill="#180A2E" stroke="#A855F7" stroke-width="0.6" />
    <text x="237" y="20" fill="#C084FC" font-size="8" font-weight="bold" text-anchor="middle" class="mono-font">ACTIVE</text>
    <line x1="12" y1="34" x2="268" y2="34" stroke="#221240" stroke-width="1" />
    <text x="12" y="49" fill="#94A3B8" font-size="10">Stateful LangGraph loops &amp; Gemini Voice</text>
    <text x="12" y="63" fill="#C084FC" font-size="9.5" class="mono-font">Autonomous Tool Calling • RAG Vector</text>
  </g>

  <!-- ==================== SATELLITE MODULE 4: AUTOMATION & INFRA (Bottom-Right) ==================== -->
  <g transform="translate(656, 168)" class="hud-font">
    <rect x="0" y="0" width="280" height="74" rx="6" fill="url(#nodeAiGrad)" stroke="#2B1A4E" stroke-width="1.2" />
    <circle cx="16" cy="18" r="4" fill="#38BDF8" class="beacon" />
    <text x="28" y="22" fill="#F1F5F9" font-size="12" font-weight="bold">⚡ SYSTEM AUTOMATION</text>
    <rect x="204" y="9" width="66" height="16" rx="2" fill="#091A2E" stroke="#38BDF8" stroke-width="0.6" />
    <text x="237" y="20" fill="#38BDF8" font-size="8" font-weight="bold" text-anchor="middle" class="mono-font">SYNCED</text>
    <line x1="12" y1="34" x2="268" y2="34" stroke="#221240" stroke-width="1" />
    <text x="12" y="49" fill="#94A3B8" font-size="10">n8n webhook triggers &amp; Windows automation</text>
    <text x="12" y="63" fill="#38BDF8" font-size="9.5" class="mono-font">FastAPI REST • Docker Sandboxing</text>
  </g>

  <!-- ==================== BOTTOM TELEMETRY STRIP ==================== -->
  <g class="mono-font" transform="translate(24, 252)">
    <rect x="0" y="0" width="912" height="22" rx="3" fill="#040F1E" stroke="#0E243E" stroke-width="0.8" />
    <text x="12" y="14" fill="#00E5FF" font-size="9" font-weight="bold">ORCHESTRATION: STATEFUL FLOW</text>
    <text x="230" y="14" fill="#64748B" font-size="9">|</text>
    <text x="250" y="14" fill="#00FF9D" font-size="9">THREAT MITIGATION: ACTIVE FIREWALL HOOKS</text>
    <text x="590" y="14" fill="#64748B" font-size="9">|</text>
    <text x="610" y="14" fill="#94A3B8" font-size="9">LATENCY: 0.01ms</text>
    <text x="900" y="14" fill="#A855F7" font-size="9" font-weight="bold" text-anchor="end">NODE: MAR-OPS-01</text>
  </g>
</svg>
