<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A10" />
      <stop offset="50%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#05080E" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#00FF9D" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.6" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF9D" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-opacity="0.25" stroke-width="1.5" />
    </pattern>

    <!-- Filter for Neon Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes lineFadeIn {
      0% { opacity: 0; transform: translateX(-4px); }
      100% { opacity: 1; transform: translateX(0); }
    }

    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @keyframes bannerGlow {
      0%, 100% { opacity: 0.9; filter: drop-shadow(0 0 4px #00FF9D); }
      50% { opacity: 1; filter: drop-shadow(0 0 12px #00FF9D); }
    }

    @keyframes scanSweep {
      0% { transform: translateY(0); opacity: 0.3; }
      50% { opacity: 0.6; }
      100% { transform: translateY(335px); opacity: 0.1; }
    }

    /* Overall sequence timing (12s total loop) */
    @keyframes bootSeq0 { 0%, 2% { opacity: 0; } 4%, 93% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes bootSeq1 { 0%, 10% { opacity: 0; } 13%, 93% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes bootSeq2 { 0%, 19% { opacity: 0; } 22%, 93% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes bootSeq3 { 0%, 28% { opacity: 0; } 31%, 93% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes bootSeq4 { 0%, 37% { opacity: 0; } 40%, 93% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes bootSeq5 { 0%, 46% { opacity: 0; } 49%, 93% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes bootSeq6 { 0%, 55% { opacity: 0; } 58%, 93% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes bootSeq7 { 0%, 65% { opacity: 0; } 68%, 93% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes bootSeq8 { 0%, 75% { opacity: 0; } 78%, 93% { opacity: 1; } 97%, 100% { opacity: 0; } }

    .term-font {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', Consolas, monospace;
    }

    .seq-0 { animation: bootSeq0 12s infinite ease-out; }
    .seq-1 { animation: bootSeq1 12s infinite ease-out; }
    .seq-2 { animation: bootSeq2 12s infinite ease-out; }
    .seq-3 { animation: bootSeq3 12s infinite ease-out; }
    .seq-4 { animation: bootSeq4 12s infinite ease-out; }
    .seq-5 { animation: bootSeq5 12s infinite ease-out; }
    .seq-6 { animation: bootSeq6 12s infinite ease-out; }
    .seq-7 { animation: bootSeq7 12s infinite ease-out; }
    .seq-8 { animation: bootSeq8 12s infinite ease-out; }

    .cursor { animation: cursorBlink 0.85s infinite; }
    .scanner { animation: scanSweep 4s linear infinite; }
    .glow-pulse { animation: bannerGlow 2.5s infinite ease-in-out; }
  </style>

  <!-- Outer Window Shadow -->
  <rect x="12" y="12" width="776" height="356" rx="10" fill="#000000" opacity="0.6" filter="url(#neonGlow)" />

  <!-- Main Terminal Card -->
  <rect x="10" y="10" width="780" height="360" rx="10" fill="url(#bgGrad)" stroke="#1F293D" stroke-width="1.5" />
  
  <!-- Glowing Border Accent Top -->
  <path d="M 10 20 Q 10 10 20 10 L 780 10 Q 790 10 790 20" fill="none" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Window Header -->
  <rect x="10" y="10" width="780" height="38" rx="10" fill="#0D131F" />
  <rect x="10" y="38" width="780" height="10" fill="#0D131F" />
  <line x1="10" y1="48" x2="790" y2="48" stroke="#1F293D" stroke-width="1" />

  <!-- Terminal Control Buttons -->
  <circle cx="32" cy="29" r="6" fill="#EF4444" />
  <circle cx="52" cy="29" r="6" fill="#F59E0B" />
  <circle cx="72" cy="29" r="6" fill="#10B981" />

  <!-- Header Title -->
  <g class="term-font" font-size="12">
    <text x="400" y="33" fill="#94A3B8" text-anchor="middle" font-weight="600" letter-spacing="0.5">
      ABDULLAH@CYBER-LAB: ~ (zsh) — SEC-OPS-NODE-01
    </text>
    <!-- Right Status Chip -->
    <rect x="670" y="21" width="105" height="18" rx="4" fill="#09141F" stroke="#00FF9D" stroke-width="0.8" />
    <circle cx="682" cy="30" r="3" fill="#00FF9D">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="692" y="33" fill="#00FF9D" font-size="10" font-weight="bold" letter-spacing="0.5">ONLINE // 256-BIT</text>
  </g>

  <!-- Scanlines Overlay -->
  <rect x="10" y="48" width="780" height="322" fill="url(#scanlines)" pointer-events="none" />

  <!-- Moving Scan Beam -->
  <g class="scanner" pointer-events="none">
    <line x1="10" y1="48" x2="790" y2="48" stroke="#00FF9D" stroke-width="1.5" stroke-opacity="0.3" />
    <rect x="10" y="44" width="780" height="8" fill="url(#accentGrad)" opacity="0.04" />
  </g>

  <!-- Terminal Content Area -->
  <g class="term-font" font-size="13">
    <!-- Command Prompt & Command -->
    <g class="seq-0">
      <text x="35" y="82" fill="#00E5FF" font-weight="bold">ABDULLAH@CYBER-LAB</text>
      <text x="180" y="82" fill="#64748B">:</text>
      <text x="190" y="82" fill="#00FF9D" font-weight="bold">~$</text>
      <text x="215" y="82" fill="#F1F5F9" font-weight="bold">./initialize.sh</text>
    </g>

    <!-- Boot Step 1: Identity -->
    <g class="seq-1">
      <text x="35" y="112" fill="#64748B">[00.12s]</text>
      <text x="100" y="112" fill="#94A3B8">&gt; Loading identity ............................</text>
      <text x="680" y="112" fill="#00FF9D" font-weight="bold">[OK]</text>
    </g>

    <!-- Boot Step 2: Security Modules -->
    <g class="seq-2">
      <text x="35" y="138" fill="#64748B">[00.38s]</text>
      <text x="100" y="138" fill="#94A3B8">&gt; Loading security modules ....................</text>
      <text x="680" y="138" fill="#00FF9D" font-weight="bold">[OK]</text>
    </g>

    <!-- Boot Step 3: IDS Engine -->
    <g class="seq-3">
      <text x="35" y="164" fill="#64748B">[00.65s]</text>
      <text x="100" y="164" fill="#94A3B8">&gt; Initializing IDS engine (Scapy telemetry) ...</text>
      <text x="680" y="164" fill="#00FF9D" font-weight="bold">[OK]</text>
    </g>

    <!-- Boot Step 4: AI Agents -->
    <g class="seq-4">
      <text x="35" y="190" fill="#64748B">[00.91s]</text>
      <text x="100" y="190" fill="#94A3B8">&gt; Initializing AI agents (LangGraph / RAG) ....</text>
      <text x="680" y="190" fill="#00FF9D" font-weight="bold">[OK]</text>
    </g>

    <!-- Boot Step 5: Automation Layer -->
    <g class="seq-5">
      <text x="35" y="216" fill="#64748B">[01.18s]</text>
      <text x="100" y="216" fill="#94A3B8">&gt; Loading automation layer (n8n / APIs) .......</text>
      <text x="680" y="216" fill="#00FF9D" font-weight="bold">[OK]</text>
    </g>

    <!-- Boot Step 6: System Integrity -->
    <g class="seq-6">
      <text x="35" y="242" fill="#64748B">[01.42s]</text>
      <text x="100" y="242" fill="#94A3B8">&gt; Verifying defense-in-depth posture .........</text>
      <text x="680" y="242" fill="#00FF9D" font-weight="bold">[OK]</text>
    </g>

    <!-- System Online Banner -->
    <g class="seq-7">
      <rect x="35" y="264" width="730" height="38" rx="6" fill="#0A1826" stroke="#00FF9D" stroke-width="1" class="glow-pulse" />
      <circle cx="55" cy="283" r="4" fill="#00FF9D">
        <animate attributeName="r" values="3;5;3" dur="1.5s" repeatCount="indefinite" />
      </circle>
      <text x="70" y="288" fill="#00FF9D" font-weight="bold" font-size="14" letter-spacing="1.5">
        SYSTEM STATUS: ONLINE
      </text>
      <text x="270" y="288" fill="#00E5FF" font-weight="bold" font-size="12" letter-spacing="1">
        // ALL DIRECTIVES OPERATIONAL — READY FOR INPUT
      </text>
      <text x="680" y="288" fill="#38BDF8" font-size="11" font-weight="bold">SEC-LVL-1</text>
    </g>

    <!-- Returning Prompt with Blinking Cursor -->
    <g class="seq-8">
      <text x="35" y="332" fill="#00E5FF" font-weight="bold">ABDULLAH@CYBER-LAB</text>
      <text x="180" y="332" fill="#64748B">:</text>
      <text x="190" y="332" fill="#00FF9D" font-weight="bold">~$</text>
      <rect x="215" y="320" width="9" height="15" fill="#00FF9D" class="cursor" />
    </g>
  </g>
</svg>
