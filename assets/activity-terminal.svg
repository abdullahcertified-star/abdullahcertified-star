<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="actBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A10" />
      <stop offset="50%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#05080E" />
    </linearGradient>

    <!-- Scanline Pattern -->
    <pattern id="actScanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-opacity="0.2" stroke-width="1.5" />
    </pattern>

    <filter id="actGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes cursorBlinkAct {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @keyframes statusPulse {
      0%, 100% { filter: drop-shadow(0 0 3px #00FF9D); }
      50% { filter: drop-shadow(0 0 10px #00FF9D); }
    }

    /* Sequential reveal sequence over 11s */
    @keyframes actSeq0 { 0%, 2% { opacity: 0; } 5%, 93% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes actSeq1 { 0%, 10% { opacity: 0; } 14%, 93% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes actSeq2 { 0%, 20% { opacity: 0; } 24%, 93% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes actSeq3 { 0%, 30% { opacity: 0; } 34%, 93% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes actSeq4 { 0%, 40% { opacity: 0; } 44%, 93% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes actSeq5 { 0%, 50% { opacity: 0; } 54%, 93% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes actSeq6 { 0%, 60% { opacity: 0; } 64%, 93% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes actSeq7 { 0%, 70% { opacity: 0; } 74%, 93% { opacity: 1; } 97%, 100% { opacity: 0; } }

    .act-font {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', Consolas, monospace;
    }

    .seq-a0 { animation: actSeq0 11s infinite ease-out; }
    .seq-a1 { animation: actSeq1 11s infinite ease-out; }
    .seq-a2 { animation: actSeq2 11s infinite ease-out; }
    .seq-a3 { animation: actSeq3 11s infinite ease-out; }
    .seq-a4 { animation: actSeq4 11s infinite ease-out; }
    .seq-a5 { animation: actSeq5 11s infinite ease-out; }
    .seq-a6 { animation: actSeq6 11s infinite ease-out; }
    .seq-a7 { animation: actSeq7 11s infinite ease-out; }

    .act-cursor { animation: cursorBlinkAct 0.85s infinite; }
    .pulse-building { animation: statusPulse 2s infinite ease-in-out; }
  </style>

  <!-- Card Base -->
  <rect x="10" y="10" width="780" height="320" rx="10" fill="url(#actBg)" stroke="#1F293D" stroke-width="1.5" />

  <!-- Window Header -->
  <rect x="10" y="10" width="780" height="36" rx="10" fill="#0D131F" />
  <rect x="10" y="36" width="780" height="10" fill="#0D131F" />
  <line x1="10" y1="46" x2="790" y2="46" stroke="#1F293D" stroke-width="1" />

  <!-- Traffic Lights -->
  <circle cx="32" cy="28" r="5.5" fill="#EF4444" />
  <circle cx="50" cy="28" r="5.5" fill="#F59E0B" />
  <circle cx="68" cy="28" r="5.5" fill="#10B981" />

  <!-- Window Title -->
  <g class="act-font" font-size="12">
    <text x="400" y="32" fill="#94A3B8" text-anchor="middle" font-weight="600" letter-spacing="0.5">
      DEVELOPMENT_LOG // CONTINUOUS_LEARNING_TELEMETRY
    </text>
    <!-- Right Live Chip -->
    <rect x="680" y="20" width="95" height="18" rx="4" fill="#09141F" stroke="#00E5FF" stroke-width="0.8" />
    <circle cx="692" cy="29" r="3" fill="#00E5FF">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="702" y="32" fill="#00E5FF" font-size="10" font-weight="bold" letter-spacing="0.5">LIVE LOG</text>
  </g>

  <!-- Scanlines Overlay -->
  <rect x="10" y="46" width="780" height="284" fill="url(#actScanlines)" pointer-events="none" />

  <!-- Terminal Content Area -->
  <g class="act-font" font-size="13">
    <!-- Prompt Command -->
    <g class="seq-a0">
      <text x="35" y="78" fill="#00E5FF" font-weight="bold">$</text>
      <text x="55" y="78" fill="#F1F5F9" font-weight="bold">./development_log</text>
    </g>

    <!-- Activity Log Line 1 -->
    <g class="seq-a1">
      <text x="35" y="108" fill="#00FF9D" font-weight="bold">[+]</text>
      <text x="65" y="108" fill="#F1F5F9">Studying cybersecurity</text>
      <text x="300" y="108" fill="#64748B">// SOC, SIEM architectures &amp; threat models</text>
    </g>

    <!-- Activity Log Line 2 -->
    <g class="seq-a2">
      <text x="35" y="134" fill="#00FF9D" font-weight="bold">[+]</text>
      <text x="65" y="134" fill="#F1F5F9">Building security tools</text>
      <text x="300" y="134" fill="#64748B">// Scapy sniffers, packet parsers &amp; IDS telemetry</text>
    </g>

    <!-- Activity Log Line 3 -->
    <g class="seq-a3">
      <text x="35" y="160" fill="#00FF9D" font-weight="bold">[+]</text>
      <text x="65" y="160" fill="#F1F5F9">Experimenting with AI agents</text>
      <text x="300" y="160" fill="#64748B">// LangGraph state graphs, RAG &amp; autonomous loops</text>
    </g>

    <!-- Activity Log Line 4 -->
    <g class="seq-a4">
      <text x="35" y="186" fill="#00FF9D" font-weight="bold">[+]</text>
      <text x="65" y="186" fill="#F1F5F9">Automating workflows</text>
      <text x="300" y="186" fill="#64748B">// n8n webhooks, REST handlers &amp; OS tooling</text>
    </g>

    <!-- Activity Log Line 5 -->
    <g class="seq-a5">
      <text x="35" y="212" fill="#00FF9D" font-weight="bold">[+]</text>
      <text x="65" y="212" fill="#F1F5F9">Learning networking</text>
      <text x="300" y="212" fill="#64748B">// TCP/IP protocol stack, sockets &amp; packet craft</text>
    </g>

    <!-- Activity Log Line 6 -->
    <g class="seq-a6">
      <text x="35" y="238" fill="#00FF9D" font-weight="bold">[+]</text>
      <text x="65" y="238" fill="#F1F5F9">Improving secure software</text>
      <text x="300" y="238" fill="#64748B">// JWT, bcrypt, input validation &amp; defensive coding</text>
    </g>

    <!-- Final STATUS: BUILDING Banner -->
    <g class="seq-a7">
      <rect x="35" y="260" width="730" height="42" rx="6" fill="#0A1E18" stroke="#00FF9D" stroke-width="1.2" class="pulse-building" />
      <circle cx="55" cy="281" r="5" fill="#00FF9D" />
      <text x="70" y="286" fill="#00FF9D" font-weight="bold" font-size="14" letter-spacing="1.5">
        STATUS: BUILDING
      </text>
      <text x="235" y="285" fill="#94A3B8" font-size="11">
        • Engineering habits over passive theory • Active iterations &amp; continuous research
      </text>
      <rect x="715" y="273" width="9" height="16" fill="#00FF9D" class="act-cursor" />
    </g>
  </g>
</svg>
