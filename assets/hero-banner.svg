<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="heroBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B16" />
      <stop offset="50%" stop-color="#081426" />
      <stop offset="100%" stop-color="#040812" />
    </linearGradient>

    <!-- Border Line Glow -->
    <linearGradient id="heroBorderGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00FF9D" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.8" />
    </linearGradient>

    <!-- Name Text Gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Dot Matrix Pattern -->
    <pattern id="heroGridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#38BDF8" fill-opacity="0.12" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="hudGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes radarSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes ledPulse {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px #00FF9D); }
      50% { opacity: 0.35; filter: drop-shadow(0 0 1px #00FF9D); }
    }
    @keyframes barWave1 { 0%, 100% { height: 8px; } 50% { height: 26px; } }
    @keyframes barWave2 { 0%, 100% { height: 24px; } 50% { height: 10px; } }
    @keyframes barWave3 { 0%, 100% { height: 14px; } 50% { height: 28px; } }
    @keyframes barWave4 { 0%, 100% { height: 22px; } 50% { height: 8px; } }
    @keyframes barWave5 { 0%, 100% { height: 12px; } 50% { height: 25px; } }

    @keyframes beamSweep {
      0% { transform: translateX(-300px); opacity: 0.1; }
      50% { opacity: 0.4; }
      100% { transform: translateX(1000px); opacity: 0.1; }
    }

    .radar-rotate {
      transform-origin: 820px 110px;
      animation: radarSpin 5s linear infinite;
    }
    .status-pulse { animation: ledPulse 1.8s infinite ease-in-out; }
    .laser-sweep { animation: beamSweep 4s linear infinite; }

    .bar-1 { animation: barWave1 1.2s infinite ease-in-out; }
    .bar-2 { animation: barWave2 1.4s infinite ease-in-out; }
    .bar-3 { animation: barWave3 1.1s infinite ease-in-out; }
    .bar-4 { animation: barWave4 1.5s infinite ease-in-out; }
    .bar-5 { animation: barWave5 1.3s infinite ease-in-out; }

    .hud-mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', Consolas, monospace;
    }
    .hud-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
  </style>

  <!-- Card Base Background -->
  <rect x="6" y="6" width="948" height="208" rx="8" fill="url(#heroBgGrad)" stroke="#162A45" stroke-width="1.5" />
  <rect x="6" y="6" width="948" height="208" rx="8" fill="url(#heroGridPattern)" pointer-events="none" />

  <!-- Top Accent Glowing Border -->
  <path d="M 8 20 L 8 8 L 952 8 L 952 20" fill="none" stroke="url(#heroBorderGlow)" stroke-width="2" />
  <path d="M 8 200 L 8 212 L 952 212 L 952 200" fill="none" stroke="#162A45" stroke-width="1.5" />

  <!-- Chamfered Corner Cyber Brackets -->
  <polygon points="6,6 26,6 6,26" fill="#00E5FF" />
  <polygon points="954,6 934,6 954,26" fill="#00FF9D" />
  <polygon points="6,214 26,214 6,194" fill="#00FF9D" />
  <polygon points="954,214 934,214 954,194" fill="#00E5FF" />

  <!-- Moving Laser Beam Sweep across header -->
  <g class="laser-sweep" pointer-events="none">
    <line x1="0" y1="8" x2="100" y2="212" stroke="#00FF9D" stroke-width="1.5" stroke-opacity="0.35" filter="url(#hudGlow)" />
  </g>

  <!-- ==================== LEFT SECTION: OPERATOR IDENTITY ==================== -->
  <g transform="translate(36, 32)">
    <!-- Top Telemetry Status Chip -->
    <g class="hud-mono">
      <rect x="0" y="0" width="220" height="20" rx="3" fill="#061A2B" stroke="#00E5FF" stroke-width="0.8" />
      <circle cx="10" cy="10" r="3" fill="#00E5FF" />
      <text x="22" y="14" fill="#00E5FF" font-size="9.5" font-weight="bold" letter-spacing="1">
        SEC-OPS // NODE_MAR_01
      </text>
      <text x="235" y="14" fill="#64748B" font-size="9" letter-spacing="0.5">
        LOC: 31.4187° N, 73.0791° E
      </text>
    </g>

    <!-- Main Name Title -->
    <text x="0" y="56" fill="url(#nameGrad)" font-size="26" font-weight="800" letter-spacing="1" class="hud-sans">
      MUHAMMAD ABDULLAH RASHID
    </text>

    <!-- Subtitle / Identity -->
    <g class="hud-mono" font-size="12" font-weight="bold">
      <text x="0" y="82" fill="#00FF9D" letter-spacing="1.2">
        CYBERSECURITY SPECIALIST × AGENTIC AI ARCHITECT
      </text>
    </g>

    <!-- University & Academics Badge -->
    <g class="hud-sans" font-size="11">
      <rect x="0" y="98" width="135" height="22" rx="3" fill="#09182C" stroke="#1E385C" stroke-width="0.8" />
      <text x="67" y="113" fill="#38BDF8" font-weight="600" text-anchor="middle">BS Cyber Security</text>

      <rect x="142" y="98" width="85" height="22" rx="3" fill="#09182C" stroke="#1E385C" stroke-width="0.8" />
      <text x="184" y="113" fill="#94A3B8" font-weight="600" text-anchor="middle">2024–2028</text>

      <rect x="234" y="98" width="195" height="22" rx="3" fill="#09182C" stroke="#1E385C" stroke-width="0.8" />
      <text x="331" y="113" fill="#F1F5F9" font-weight="600" text-anchor="middle">The University of Faisalabad</text>
    </g>

    <!-- Core Mission Tagline -->
    <g class="hud-mono" font-size="10.5">
      <text x="0" y="148" fill="#94A3B8">DIRECTIVE:</text>
      <text x="75" y="148" fill="#F1F5F9" font-weight="bold">
        Detect Threats • Analyze Wire Packets • Automate Reasoning • Defend Systems
      </text>
    </g>
  </g>

  <!-- ==================== RIGHT SECTION: LIVE HUD RADAR & SPECTRUM ==================== -->
  <g transform="translate(800, 108)">
    <!-- Radar Base Outer Rings -->
    <circle cx="0" cy="0" r="62" fill="#061222" stroke="#132B48" stroke-width="1.2" />
    <circle cx="0" cy="0" r="46" fill="none" stroke="#00E5FF" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.6" />
    <circle cx="0" cy="0" r="28" fill="none" stroke="#00FF9D" stroke-width="0.8" stroke-opacity="0.4" />
    <circle cx="0" cy="0" r="8" fill="#042016" stroke="#00FF9D" stroke-width="1.5" />
    <circle cx="0" cy="0" r="3" fill="#00FF9D" />

    <!-- Crosshair Lines -->
    <line x1="-62" y1="0" x2="62" y2="0" stroke="#132B48" stroke-width="1" />
    <line x1="0" y1="-62" x2="0" y2="62" stroke="#132B48" stroke-width="1" />

    <!-- Threat Blips -->
    <circle cx="22" cy="-20" r="3" fill="#EF4444" />
    <circle cx="-32" cy="18" r="2.5" fill="#00FF9D" />
    <circle cx="16" cy="34" r="2" fill="#00E5FF" />

    <!-- Rotating Radar Sweep Beam -->
    <g class="radar-rotate">
      <path d="M 0 0 L 44 -44 A 62 62 0 0 1 62 0 Z" fill="#00FF9D" fill-opacity="0.18" />
      <line x1="0" y1="0" x2="44" y2="-44" stroke="#00FF9D" stroke-width="1.5" stroke-opacity="0.8" />
    </g>
  </g>

  <!-- Live Status Chip (Above Radar) -->
  <g class="hud-mono" transform="translate(680, 24)">
    <rect x="0" y="0" width="240" height="24" rx="4" fill="#031812" stroke="#00FF9D" stroke-width="1" />
    <circle cx="14" cy="12" r="4" fill="#00FF9D" class="status-pulse" />
    <text x="26" y="16" fill="#00FF9D" font-size="10" font-weight="bold" letter-spacing="1">
      SYSTEM STATUS: OPERATIONAL
    </text>
  </g>

  <!-- Dynamic Frequency Audio / Telemetry Wave (Bottom Right) -->
  <g transform="translate(660, 168)">
    <rect x="-10" y="-8" width="130" height="34" rx="4" fill="#061527" stroke="#162D4A" stroke-width="0.8" />
    <!-- 5 Frequency Bars -->
    <rect x="10" y="2" width="4" height="12" rx="1" fill="#00E5FF" class="bar-1" />
    <rect x="22" y="2" width="4" height="22" rx="1" fill="#38BDF8" class="bar-2" />
    <rect x="34" y="2" width="4" height="16" rx="1" fill="#00FF9D" class="bar-3" />
    <rect x="46" y="2" width="4" height="20" rx="1" fill="#A855F7" class="bar-4" />
    <rect x="58" y="2" width="4" height="14" rx="1" fill="#00E5FF" class="bar-5" />
    <text x="74" y="14" fill="#38BDF8" font-size="9" font-weight="bold" class="hud-mono">AI-STREAM</text>
  </g>
</svg>
