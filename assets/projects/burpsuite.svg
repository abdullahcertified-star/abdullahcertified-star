<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" width="100%" height="100%">
  <defs>
    <linearGradient id="burpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140A06" />
      <stop offset="100%" stop-color="#1F1008" />
    </linearGradient>
    <pattern id="burpDot" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#F59E0B" fill-opacity="0.1" />
    </pattern>
  </defs>

  <style>
    .card-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace; }
  </style>

  <!-- Background Base -->
  <rect x="4" y="4" width="412" height="192" rx="8" fill="url(#burpBg)" stroke="#42220E" stroke-width="1.2" />
  <rect x="4" y="4" width="412" height="192" rx="8" fill="url(#burpDot)" pointer-events="none" />

  <!-- Corner Brackets -->
  <path d="M 6 22 L 6 6 L 22 6" fill="none" stroke="#F59E0B" stroke-width="2" />
  <path d="M 414 22 L 414 6 L 398 6" fill="none" stroke="#EF4444" stroke-width="2" />

  <!-- Visual Pic: Target Reticle & Intercept Proxy Arrows (Right Side) -->
  <g transform="translate(345, 95)">
    <circle cx="0" cy="0" r="38" fill="#241108" stroke="#5C2B0E" stroke-width="1" />
    <!-- Reticle crosshairs -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="#F59E0B" stroke-width="1" stroke-dasharray="6 3" />
    <circle cx="0" cy="0" r="14" fill="none" stroke="#EF4444" stroke-width="1.2" />
    <line x1="-34" y1="0" x2="-18" y2="0" stroke="#F59E0B" stroke-width="1.5" />
    <line x1="18" y1="0" x2="34" y2="0" stroke="#F59E0B" stroke-width="1.5" />
    <line x1="0" y1="-34" x2="0" y2="-18" stroke="#F59E0B" stroke-width="1.5" />
    <line x1="0" y1="18" x2="0" y2="34" stroke="#F59E0B" stroke-width="1.5" />
    <circle cx="0" cy="0" r="3.5" fill="#EF4444" />
  </g>

  <!-- Left Content Info -->
  <g class="card-font">
    <!-- Category & Lang Badge -->
    <rect x="18" y="16" width="105" height="18" rx="3" fill="#321406" stroke="#F59E0B" stroke-width="0.8" />
    <text x="70" y="29" fill="#F59E0B" font-size="9" font-weight="bold" text-anchor="middle">WEB APP SECURITY</text>

    <rect x="129" y="16" width="62" height="18" rx="3" fill="#2A100B" stroke="#EF4444" stroke-width="0.8" />
    <text x="160" y="29" fill="#EF4444" font-size="9" font-weight="bold" text-anchor="middle">Research</text>

    <!-- Title -->
    <text x="18" y="58" fill="#F1F5F9" font-size="13.5" font-weight="bold" letter-spacing="0.3">BurpSuite-Pro-2026-loader</text>

    <!-- Description Lines -->
    <text x="18" y="82" fill="#94A3B8" font-size="11">Cybersecurity research &amp; web application security</text>
    <text x="18" y="99" fill="#94A3B8" font-size="11">toolkit for penetration testing, vulnerability discovery,</text>
    <text x="18" y="116" fill="#94A3B8" font-size="11">and Burp Suite Professional research access.</text>

    <!-- Feature Tags -->
    <rect x="18" y="134" width="70" height="18" rx="3" fill="#2A1408" />
    <text x="53" y="146" fill="#F59E0B" font-size="9" text-anchor="middle">Pen Testing</text>

    <rect x="94" y="134" width="65" height="18" rx="3" fill="#2A1408" />
    <text x="126" y="146" fill="#F59E0B" font-size="9" text-anchor="middle">Web Audit</text>

    <rect x="165" y="134" width="68" height="18" rx="3" fill="#2A1408" />
    <text x="199" y="146" fill="#F59E0B" font-size="9" text-anchor="middle">Proxy Inspect</text>

    <!-- Footer Action -->
    <line x1="18" y1="165" x2="402" y2="165" stroke="#321A0C" stroke-width="1" />
    <text x="18" y="182" fill="#F59E0B" font-size="10" font-weight="bold">Explore Repository ↗</text>
    <text x="402" y="182" fill="#64748B" font-size="10" text-anchor="end">★ 1 STAR</text>
  </g>
</svg>
